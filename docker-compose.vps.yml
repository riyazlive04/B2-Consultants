# B2 Consultants — the dedicated production VPS (srv2064204, Hostinger Mumbai 2).
#
#   caddy → TLS termination + reverse proxy, owns :80/:443, auto Let's Encrypt
#   app   → the Next standalone server, private, never published to the host
#   cron  → ticks /api/cron/* over the private network (the app has no clock)
#
# THE DATABASE IS NOT IN THIS FILE, BUT IT IS NOW ON THIS BOX.
#
# It used to be hosted Supabase in ap-southeast-1. It is now a SELF-HOSTED Supabase stack
# living in its own compose project at /root/supabase/docker, reached over the shared
# external network `b2_data`. See docs/SELFHOSTED_SUPABASE_MIGRATION.md.
#
# The old warning here said adding a `db` service would silently create an EMPTY database
# while looking like it worked. That is STILL TRUE and still the reason there is no `db`
# service below: the database is owned by the other compose project, and a second one
# declared here would start a blank Postgres that the app would happily connect to and
# report healthy against. If `db` ever appears in this file, something has gone wrong.
#
# Usage:  docker compose -f docker-compose.vps.yml --env-file .env.production up -d
#
# Order matters on a cold boot. This project does not (and cannot) `depends_on` a service in
# another project, so bring the database up first:
#     cd /root/supabase/docker && docker compose up -d
#     cd /root/b2            && docker compose -f docker-compose.vps.yml --env-file .env.production up -d
# Out of order is survivable — `app` fails its healthcheck, caddy withholds traffic, and it
# recovers once the database answers — but it will look like an outage for a minute.
#
# ---------------------------------------------------------------------------
# WHY THERE IS NO `migrate` SERVICE HERE
#
# docker-compose.prod.yml gates `app` on a one-shot `prisma migrate deploy`. That
# gate is only as good as the image behind it, and the image is built from a
# SEPARATE build stage. On the old box that image drifted four weeks behind the
# migrations it was supposed to apply, so `up -d` reported success while applying
# nothing — the failure mode the gate exists to prevent, wearing the gate's badge.
#
# Rather than ship a stale gate, migrations are applied explicitly BEFORE the
# image is shipped, from a machine that has the matching checkout:
#
#     npm run db:deploy        # against DIRECT_URL, the :5432 session pooler
#
# and verified afterwards by comparing prisma/migrations against the
# _prisma_migrations table. Deploy is then a pure image swap, which is also why
# `app` below pulls no build context: this box runs images, it does not build.
#
# The trade is deliberate: the gate was protection we did not actually have, and
# an explicit step that runs is worth more than an implicit one that silently
# does not. Do not add a `migrate` service back without also rebuilding its image
# in the same step that builds `app`.
# ---------------------------------------------------------------------------

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 80 must stay open even though the app is https-only: the ACME HTTP-01
      # challenge and the ->https redirect both live there.
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, not bind mounts: caddy_data holds the issued certificate
      # and the ACME account key. Lose it and every restart re-requests a cert,
      # which hits Let's Encrypt's rate limit (5 identical certs/week) and then
      # serves TLS errors to real users.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN to your domain, e.g. b2app.sirahagents.com}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL for Let's Encrypt expiry notices}
    depends_on:
      app:
        condition: service_healthy

  app:
    # Prebuilt and loaded with `docker load`; this box never builds. The tag is
    # the deployed commit, so `docker ps` answers "what is live?" on its own.
    image: ${APP_IMAGE:?set APP_IMAGE, e.g. b2-app:f422098}
    restart: unless-stopped
    # NOT published to the host. Only caddy and cron reach it, over the compose
    # network. Publishing 3000 would expose the app on http://<vps-ip>:3000 and
    # bypass TLS entirely.
    expose:
      - "3000"
    init: true # PID-1 reaper so SIGTERM from `compose down` is handled, not ignored
    read_only: true # the app writes nothing to disk: CV parsing and PDF rendering are in-memory
    tmpfs:
      # App CODE writes nothing, but the Next runtime does: revalidatePath() and
      # the full-route/fetch cache write under .next/cache, and the framework
      # wants /tmp. Back both with tmpfs so read_only stays on without an EROFS.
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /api/health does a real SELECT 1 — a container that is up but cannot
      # reach Supabase reports unhealthy rather than serving 500s behind a
      # green light. caddy gates on this, so a broken deploy never gets traffic.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      # `default` keeps caddy and cron able to reach this container by the name `app`.
      # `b2_data` is how it reaches the self-hosted database.
      #
      # Both must be listed. Compose REPLACES this list rather than merging it, so naming only
      # b2_data would silently cut caddy off from the app — a 502 that looks like the app
      # crashed when in fact it is healthy and simply unreachable.
      - default
      - b2_data

    environment:
      # --- Required. The container refuses to boot without these (src/lib/env.ts) ---
      #
      # Both now point at the self-hosted Postgres over `b2_data`, by CONTAINER name.
      #
      # Why `supabase-db` and not `db`: `db` is the service name in the other project and does
      # resolve, but it is generic enough to collide with anything else that ever joins this
      # network. The container name is unambiguous.
      #
      # Why DIRECT_URL is now IDENTICAL to DATABASE_URL: the whole point of the split was that
      # PgBouncer could not hold the session-level advisory lock `prisma migrate deploy` takes,
      # so migrations needed a non-pooled route. Connecting straight to Postgres, every
      # connection is already a session. The two stay as separate variables because the Prisma
      # schema declares both and env.ts requires both — not because they differ.
      #
      # Note this does NOT go through supavisor, which is running. Prisma maintains its own
      # pool, the app is the only consumer, and the hop would add latency and a second place
      # for connections to be lost without buying anything.
      DATABASE_URL: ${DATABASE_URL:?postgresql://postgres:<pw>@supabase-db:5432/postgres?schema=public&connection_limit=15}
      DIRECT_URL: ${DIRECT_URL:?same as DATABASE_URL now that Postgres is local — see above}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?must be https://<your-domain>, no trailing slash}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?openssl rand -base64 32}
      CRON_SECRET: ${CRON_SECRET:?openssl rand -base64 32}

      # --- Optional. Every one fails CLOSED: the feature is simply off when unset ---
      FX_API_URL: ${FX_API_URL:-https://api.frankfurter.app}

      # Supabase Storage — the marketing site's media origin (lib/supabase-storage.ts).
      #
      # These were NEVER set on hosted Supabase, so storageConfig() returned null and
      # /api/media/upload + /api/form-upload answered 503. Self-hosting finally gives this a
      # home: STORAGE_BACKEND=file on the 92 GB root disk. Leave them unset to keep the old
      # behaviour — the seam fails closed by design, and OFF is the recommended default until
      # someone actually wants the marketing site's media on this box.
      #
      # ⚠ SUPABASE_URL MUST BE A PUBLIC, BROWSER-REACHABLE ORIGIN. Not `http://api-gw:8000`.
      # publicUrl() does not merely fetch — its output is written to `MediaAsset.url` and
      # handed to browsers for next/image. An internal docker name there yields rows full of
      # URLs that resolve for nothing outside the compose network, and the upload still
      # reports success. Worse, it is a one-way mistake: the value is BAKED INTO EVERY ROW at
      # upload time, so changing it later orphans every image already stored. Choose the
      # hostname once, before the first upload.
      #
      # Turning this on therefore means publishing the gateway. Do NOT simply point a domain
      # at api-gw:8000 — that publishes PostgREST at /rest/v1 alongside the images. The
      # runbook has a Caddy block that allows ONLY /storage/v1/object/public/*.
      #
      # ⚠ SUPABASE_SERVICE_ROLE_KEY is BYPASSRLS. It may never appear in a NEXT_PUBLIC_* var,
      # a client component, or a response body. lib/supabase-storage.ts is `server-only` to
      # enforce that; keep it the single place this value is read.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-site-media}

      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Without this, /api/resend/webhook answers 503 and NO email ever advances
      # past SENT — so a hard bounce still reads "Sent" in Conversations.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      UPTIME_HEARTBEAT_URL: ${UPTIME_HEARTBEAT_URL:-}

      WATI_ENABLED: ${WATI_ENABLED:-false}
      WATI_API_ENDPOINT: ${WATI_API_ENDPOINT:-}
      WATI_ACCESS_TOKEN: ${WATI_ACCESS_TOKEN:-}
      WATI_WEBHOOK_SECRET: ${WATI_WEBHOOK_SECRET:-}

      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}

      AI_REVIEW_ENABLED: ${AI_REVIEW_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Inbound lead webhooks (Pabbly is the live router today)
      INGEST_ENABLED: ${INGEST_ENABLED:-false}
      PABBLY_WEBHOOK_SECRET: ${PABBLY_WEBHOOK_SECRET:-}
      FLEXIFUNNELS_WEBHOOK_SECRET: ${FLEXIFUNNELS_WEBHOOK_SECRET:-}
      LEAD_WEBHOOK_DEBUG: ${LEAD_WEBHOOK_DEBUG:-false}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}

      AGREEMENT_OTP_DEV_ECHO: ${AGREEMENT_OTP_DEV_ECHO:-false}

      # REDIS_URL is intentionally absent. automation-queue.ts returns null
      # without it and falls back to Postgres polling, which is the source of
      # truth anyway. Setting it with no redis service would spam connection
      # errors for no benefit.

  cron:
    image: ${CRON_IMAGE:?set CRON_IMAGE, e.g. b2-cron:f422098}
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?required — cron routes 503 without it}
      APP_URL: http://app:3000
      # The daily-log cutoff and the SOP ladder are both reasoned about in IST;
      # a UTC container would fire the EOD save 5.5h off.
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  # The app's own network: caddy ↔ app ↔ cron. Compose creates it as `b2_default`.
  default:

  # Shared with the self-hosted Supabase project so `app` can reach `supabase-db`.
  #
  # `external: true` means neither compose project creates or owns it, so `docker compose down`
  # on either side cannot take the other's networking with it. Create it once, by hand:
  #
  #     docker network create b2_data
  #
  # If it does not exist, `up -d` fails immediately with "network b2_data declared as external,
  # but could not be found" — which is the correct behaviour. A missing network that failed
  # loudly is a thirty-second fix; one that was auto-created empty would mean the app and the
  # database each sit on their own isolated network and never see each other.
  b2_data:
    external: true
